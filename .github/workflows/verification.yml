name: Verification

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-contract:
    name: Wrapper contract (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax verification
        run: npm run check:syntax
      - name: Baseline behavior tests (unmodified upstream wrapper)
        run: npm test

  package-smoke:
    name: Package dependency smoke (Ubuntu, Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Inherited package-lock.json is stale; this is not reproducible installation.
      - name: Install current declared dependencies without using stale lock
        run: npm install --no-package-lock --ignore-scripts --no-audit
      - name: Inspect package composition
        run: npm pack --dry-run

  baseline-negative-control:
    name: Baseline must fail stale-read regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce five known read/reconnect lifecycle defects on the original wrapper
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            "late successful read cannot resurrect disconnected status"
            "late failure from an obsolete read must not mark a reconnected endpoint offline"
            "a reconnect must not overlap a pending read on the same item group"
            "late successful read must not publish obsolete data after disconnect"
            "closing an endpoint cancels its polling timer during a pending read"
          )
          index=0
          for pattern in "${patterns[@]}"; do
            index=$((index + 1))
            output="known-defect-${index}.tap"
            set +e
            node --test --test-name-pattern="$pattern" test/known-defects/s7-endpoint.lifecycle.test.js > "$output" 2>&1
            code=$?
            set -e
            cat "$output"
            # An expected failure is NOT a passing reliability test. Validate
            # that only the named characterization failed, not the fixture.
            if [ "$code" -eq 0 ]; then
              echo "::error::Known defect did not reproduce: $pattern"
              exit 1
            fi
            if ! grep -E "not ok [0-9]+ -" "$output" | grep -Fq -- "$pattern"; then
              echo "::error::Named defect not observed: $pattern"
              exit 1
            fi
            if ! grep -Fq '# fail 1' "$output"; then
              echo "::error::Unexpected additional test failure: $pattern"
              exit 1
            fi
            echo "::notice::Baseline defect reproduced: $pattern"
          done
      - name: Preserve red characterization logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expected-failure-characterization-ubuntu-node22
          path: known-defect-*.tap
          if-no-files-found: warn
          retention-days: 14
